<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Alisher Bimano</title>
  <desc id="desc">Software developer building mobile apps, APIs, and product prototypes</desc>
  <defs>
